<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>تب جدید</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#search-input">پرش به جستجو</a>

  <!-- پس‌زمینهٔ زندهٔ آسمان (تزئینی) -->
  <div class="scene" aria-hidden="true">
    <div class="sky" id="sky"></div>
    <div class="horizon-glow" id="horizon-glow"></div>
    <div class="orb" id="orb"></div>
    <div class="clouds" id="clouds"></div>
    <div class="fog" id="fog"></div>
    <canvas id="fx"></canvas>
    <div class="flash" id="flash"></div>
    <div class="scrim"></div>
  </div>

  <div class="layout">
    <div class="main-col">

      <header class="topbar">
        <button class="glass chip weather-chip" id="weather-chip" type="button"
                aria-expanded="false" aria-controls="weather-panel">
          <span class="chip-icon" id="chip-icon" aria-hidden="true"></span>
          <span class="chip-temp" id="chip-temp">--°</span>
          <span class="chip-text">
            <span class="chip-desc" id="chip-desc">در حال دریافت…</span>
            <span class="chip-city" id="chip-city"></span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <button class="glass icon-btn" id="settings-btn" type="button" aria-label="تنظیمات" title="تنظیمات">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        </button>
      </header>

      <!-- پنل جزئیات آب‌وهوا؛ با کلیک روی چیپ باز می‌شود -->
      <section class="collapse" id="weather-panel" aria-label="جزئیات آب‌وهوا">
        <div class="collapse-inner">
          <div class="glass weather-panel" id="weather-body"></div>
        </div>
      </section>

      <main>
        <section class="hero" aria-label="ساعت و تاریخ">
          <p class="greeting" id="greeting"></p>
          <h1 id="time" aria-live="off">۰۰:۰۰</h1>
          <p id="date"></p>
        </section>

        <form class="glass search" action="https://www.google.com/search" method="GET" role="search">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search-input" type="search" name="q" placeholder="جستجو در وب" aria-label="جستجو در وب (میانبر: /)" autocomplete="off" autofocus>
          <kbd aria-hidden="true">/</kbd>
        </form>

        <section class="bookmarks" aria-labelledby="bm-title">
          <div class="section-head">
            <h2 id="bm-title">نشانک‌ها</h2>
            <div class="head-actions">
              <button class="glass icon-btn sm" id="bm-edit-btn" type="button" aria-pressed="false" aria-label="حالت ویرایش نشانک‌ها" title="ویرایش / حذف">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
              </button>
              <button class="glass icon-btn sm" id="bm-add-btn" type="button" aria-label="افزودن نشانک" title="افزودن نشانک">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
          </div>
          <div id="bm-list"></div>
        </section>
      </main>
    </div>

    <!-- دفترچه یادداشت (کنار صفحه) -->
    <aside class="glass notes" id="notes" aria-labelledby="notes-title">
      <div class="notes-head">
        <div>
          <h2 id="notes-title">یادداشت‌ها</h2>
          <p class="notes-sub" id="notes-sub"></p>
        </div>
        <div class="head-actions">
          <button class="glass icon-btn sm" id="notes-filter" type="button" aria-pressed="false" aria-label="فقط کارهای باز را نشان بده" title="فقط کارهای باز">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
          </button>
          <button class="glass icon-btn sm" id="notes-clear" type="button" aria-label="پاک کردن کارهای انجام‌شده" title="پاک کردن انجام‌شده‌ها">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
        </div>
      </div>

      <div class="notes-log" id="notes-log" role="log" aria-live="polite" aria-label="فهرست یادداشت‌ها" tabindex="0"></div>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="note-input">یادداشت جدید</label>
        <textarea id="note-input" rows="1" maxlength="1000" placeholder="یادداشت بنویس و Enter بزن…"></textarea>
        <button class="send-btn" type="submit" aria-label="ارسال یادداشت" title="ارسال (Enter)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14-8-4 16-3-7z"/></svg>
        </button>
      </form>
    </aside>
  </div>

  <!-- افزودن نشانک -->
  <dialog id="bm-dialog" class="glass dialog" aria-labelledby="bm-dialog-title">
    <form method="dialog" id="bm-form" class="dialog-body" novalidate>
      <h3 id="bm-dialog-title">نشانک جدید</h3>

      <label for="bm-url">آدرس سایت</label>
      <input id="bm-url" name="url" type="text" inputmode="url" dir="ltr" placeholder="example.com" autocomplete="off" required>

      <label for="bm-name">نام <span class="opt">(اختیاری)</span></label>
      <input id="bm-name" name="name" type="text" autocomplete="off" placeholder="اگر خالی بماند از آدرس ساخته می‌شود">

      <label for="bm-cat">دسته‌بندی</label>
      <input id="bm-cat" name="cat" type="text" autocomplete="off" placeholder="مثلاً کار، سرگرمی…" required>
      <div class="chips" id="bm-cat-chips" role="group" aria-label="دسته‌های موجود"></div>

      <p class="form-error" id="bm-error" role="alert"></p>

      <div class="dialog-actions">
        <button type="submit" class="btn primary" value="save">افزودن</button>
        <button type="button" class="btn" data-close>انصراف</button>
      </div>
    </form>
  </dialog>

  <!-- تنظیمات -->
  <dialog id="settings-dialog" class="glass dialog wide" aria-labelledby="settings-title">
    <div class="dialog-body">
      <div class="dialog-title-row">
        <h3 id="settings-title">تنظیمات</h3>
        <button type="button" class="icon-btn sm plain" data-close aria-label="بستن">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <fieldset>
        <legend>موقعیت مکانی</legend>
        <div class="row">
          <label class="sr-only" for="city-input">جستجوی شهر</label>
          <input id="city-input" type="search" placeholder="نام شهر (فارسی یا English)" autocomplete="off">
          <button type="button" class="btn" id="geo-btn">📍 موقعیت من</button>
        </div>
        <ul class="results" id="city-results" role="listbox" aria-label="نتایج جستجوی شهر"></ul>
        <p class="hint" id="loc-status" role="status"></p>
      </fieldset>

      <fieldset>
        <legend>نمایش</legend>
        <div class="row between">
          <span id="unit-label">واحد دما</span>
          <div class="seg" role="radiogroup" aria-labelledby="unit-label" id="seg-unit">
            <button type="button" role="radio" data-v="c" aria-checked="true" dir="ltr">°C</button>
            <button type="button" role="radio" data-v="f" aria-checked="false" dir="ltr">°F</button>
          </div>
        </div>
        <div class="row between">
          <span id="size-label">اندازهٔ متن</span>
          <div class="seg" role="radiogroup" aria-labelledby="size-label" id="seg-size">
            <button type="button" role="radio" data-v="s" aria-checked="false">کوچک</button>
            <button type="button" role="radio" data-v="m" aria-checked="true">متوسط</button>
            <button type="button" role="radio" data-v="l" aria-checked="false">بزرگ</button>
          </div>
        </div>
        <div class="row between">
          <label for="sw-fx">افکت‌های پس‌زمینه (باران، برف، ابر…)</label>
          <input class="switch" type="checkbox" id="sw-fx" role="switch">
        </div>
        <div class="row between">
          <label for="sw-contrast">کنتراست بالا</label>
          <input class="switch" type="checkbox" id="sw-contrast" role="switch">
        </div>
      </fieldset>

      <fieldset>
        <legend>پیش‌نمایش آسمان</legend>
        <div class="row between">
          <label for="sim-kind">وضعیت جوی</label>
          <select id="sim-kind">
            <option value="auto">واقعی</option>
            <option value="clear">صاف</option>
            <option value="partly">کمی ابری</option>
            <option value="cloudy">ابری</option>
            <option value="fog">مه</option>
            <option value="drizzle">نم‌نم باران</option>
            <option value="rain">باران</option>
            <option value="snow">برف</option>
            <option value="storm">رعد و برق</option>
          </select>
        </div>
        <div class="row between">
          <label for="sim-hour">ساعت <output id="sim-hour-out">واقعی</output></label>
          <input type="range" id="sim-hour" min="-1" max="23" step="1" value="-1">
        </div>
      </fieldset>

      <p class="hint">میانبرها: <kbd>/</kbd> جستجو · <kbd>N</kbd> یادداشت جدید · <kbd>Esc</kbd> بستن پنجره‌ها</p>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button type="button" id="toast-undo" class="toast-undo">برگردان</button>
  </div>
</body>
</html>
